<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="25%" stop-color="#E2AE2B" />
      <stop offset="50%" stop-color="#FFF4C4" />
      <stop offset="75%" stop-color="#C28C11" />
      <stop offset="100%" stop-color="#845903" />
    </linearGradient>

    <linearGradient id="sealNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E284E" />
      <stop offset="100%" stop-color="#06152B" />
    </linearGradient>

    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Outer scalloped / notched seal ring -->
    <circle cx="160" cy="160" r="148" fill="url(#sealGold)" stroke="#FFF" stroke-width="2" />
    <circle cx="160" cy="160" r="136" fill="url(#sealNavy)" stroke="url(#sealGold)" stroke-width="4" />
    <circle cx="160" cy="160" r="124" fill="none" stroke="url(#sealGold)" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Center circular core -->
    <circle cx="160" cy="160" r="92" fill="#0A1F3D" stroke="url(#sealGold)" stroke-width="2.5" />

    <!-- Circular curved text paths -->
    <path id="textPathTop" d="M 46,160 A 114,114 0 0,1 274,160" fill="none" />
    <text font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="800" fill="url(#sealGold)" letter-spacing="4">
      <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
        CDA APPROVED SECTOR PROJECTS
      </textPath>
    </text>

    <path id="textPathBottom" d="M 274,160 A 114,114 0 0,1 46,160" fill="none" />
    <text font-family="'Montserrat', sans-serif" font-size="11.5" font-weight="700" fill="url(#sealGold)" letter-spacing="3.5">
      <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
        ★ CAPITAL DEVELOPMENT AUTHORITY ★
      </textPath>
    </text>

    <!-- Star & Verified Emblem inside -->
    <g transform="translate(160, 150) scale(0.9)">
      <!-- Government / Legal Pillar & Arch Icon -->
      <path d="M -36,15 L 36,15 L 32,24 L -32,24 Z" fill="url(#sealGold)" />
      <path d="M -26,15 L -26,-15 M -9,15 L -9,-15 M 9,15 L 9,-15 M 26,15 L 26,-15" stroke="url(#sealGold)" stroke-width="4" stroke-linecap="round" />
      <path d="M -38,-15 L 0,-38 L 38,-15 Z" fill="url(#sealGold)" />
      <!-- Star inside pediment -->
      <circle cx="0" cy="-22" r="3.5" fill="#0A1F3D" />
    </g>

    <text x="160" y="205" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFF" letter-spacing="2">VERIFIED &amp; LEGAL</text>
    <text x="160" y="222" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="700" fill="url(#sealGold)" letter-spacing="1.5">ISLAMABAD, PAKISTAN</text>
  </g>
</svg>
